<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Olive Press Tycoon</title>
<meta name="description" content="Run Abu Yousef's olive press, from a village stone mill to an export brand.">
<meta name="theme-color" content="#1e2a1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Olive Press">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: full-screen app. Thin HUD bar on top, the 3D press house fills the middle, a dock of station buttons at the bottom opens one sheet at a time. Single dark look. */
:root{
  --bg:#141c15;
  --panel:#1e2a1f;
  --panel2:#2c3b2c;
  --fg:#f1efe2;
  --muted:#a9b59d;
  --oil:#e8b934;
  --red:#d24b3c;
  --green:#5bbf7a;
  --display:"Lilita One","Rubik",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--panel);color:var(--fg)}
body{font-family:var(--body);overscroll-behavior:none}
.app{height:100%;display:flex;flex-direction:column}
.gut{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.hud{background:var(--panel);padding-block:max(8px,env(safe-area-inset-top,0px)) 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.money{font-family:var(--display);font-size:24px;color:var(--oil);line-height:1;font-variant-numeric:tabular-nums}
.sub{font-size:11px;color:var(--muted)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:500;border-radius:999px;padding:3px 9px;background:var(--panel2);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.warn{background:#7a5a1c}
.chip.bad{background:var(--red)}
.stage{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#c4dbe3}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap}
.tag{font-size:11px;font-weight:700;background:rgba(27,33,23,.82);color:#fff;border-radius:999px;padding:3px 9px;display:flex;flex-direction:column;align-items:center;gap:3px}
.prog{width:60px;height:5px;border-radius:3px;background:#555;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--oil)}
.tapme{font-family:var(--display);font-size:14px;color:#1e2a1f;background:var(--oil);border-radius:999px;padding:4px 11px;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,185,52,.75)}100%{box-shadow:0 0 0 14px rgba(232,185,52,0)}}
.float{font-family:var(--display);font-size:18px;color:var(--oil);text-shadow:0 2px 0 #1e2a1f,0 0 6px rgba(0,0,0,.5)}
.float.bad{color:#ff8a7a}
.float.w{color:#fff}
.hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-size:12px;color:#fff;background:rgba(27,33,23,.7);border-radius:999px;padding:5px 12px;pointer-events:none;transition:opacity .6s;white-space:nowrap}
.lvpop{position:absolute;left:50%;top:44px;transform:translateX(-50%);z-index:5;font:inherit;font-size:14px;font-weight:700;color:#1e2a1f;background:var(--oil);border:0;border-radius:999px;padding:8px 16px;box-shadow:0 4px 14px rgba(0,0,0,.35);white-space:nowrap;animation:pop .35s ease-out}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
.paused{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(27,33,23,.55)}
.paused[hidden]{display:none}
.paused b{font-family:var(--display);font-weight:400;font-size:34px;color:var(--oil)}
.paused .btn{min-width:140px}
.banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;background:rgba(27,33,23,.85);border-radius:16px;padding:14px 22px;max-width:86%;white-space:normal;transition:opacity .8s}
.banner b{display:block;font-family:var(--display);font-weight:400;font-size:26px;color:var(--oil);line-height:1.1}
.banner span{font-size:13px;color:var(--fg)}
.dock{background:var(--panel);padding-block:8px max(8px,env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dk{font:inherit;cursor:pointer;position:relative;border:0;border-radius:10px;background:var(--panel2);color:var(--fg);padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.dk.sel{outline:2px solid var(--oil)}
.dk:focus-visible{outline:2px solid #fff}
.dk .dn{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dk .ds{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dk .dot{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--green)}
.dk.mv .dn{color:var(--oil)}
.mini{width:80%;height:4px;border-radius:2px;background:#15201a;overflow:hidden}
.mini i{display:block;height:100%;width:0;background:var(--oil)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:64%;background:rgba(30,42,31,.97);border-radius:16px 16px 0 0;padding-block:12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 -6px 20px rgba(0,0,0,.35)}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sh-head h3{margin:0;font-family:var(--display);font-weight:400;font-size:20px}
.x{font:inherit;cursor:pointer;border:0;background:var(--panel2);color:var(--fg);border-radius:8px;width:34px;height:34px;font-size:16px}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow-y:auto;min-height:0;overscroll-behavior:contain}
.btn.exp{background:#e0894a;color:#1e2a1f}
.bts{display:grid;grid-template-columns:1fr 1fr;gap:6px}.bts.one{grid-template-columns:1fr}
.wk{font-size:11.5px;color:var(--muted)}
.snd{font:inherit;cursor:pointer;border:0;background:var(--panel2);color:var(--fg);border-radius:999px;width:30px;height:24px;font-size:13px;padding:0}
@media (max-width:420px){.rows{grid-template-columns:1fr}.row{padding:7px 9px;gap:5px}}
.row{background:var(--panel2);border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.lab{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.lab b{color:var(--fg);font-weight:700;text-align:right}
.pips{display:flex;gap:3px}
.pips span{flex:1;height:6px;border-radius:2px;background:#15201a}
.pips span.on{background:var(--green)}
.btn{font:inherit;cursor:pointer;border:0;border-radius:8px;background:var(--oil);color:#1e2a1f;font-weight:700;font-size:13px;padding:8px;font-variant-numeric:tabular-nums}
.btn:focus-visible,.x:focus-visible,.lnk:focus-visible{outline:2px solid #fff;outline-offset:2px}
.btn[disabled]{background:#3f5144;color:#a9b59d;cursor:default}
.btn.hire{background:var(--green);color:#10200f}
.btn.hire[disabled]{background:#3f5a45;color:#a6bba9}
.mvtxt{font-size:13px;color:var(--muted);line-height:1.45;margin:0}
.bar{height:8px;border-radius:4px;background:#15201a;overflow:hidden}
.bar i{display:block;height:100%;background:var(--oil);width:0}
.lnk{font:inherit;font-size:12px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px 0;align-self:flex-start}
.lnk.armed{color:#ff8a7a}
@media (prefers-reduced-motion:reduce){.tapme{animation:none}}
</style>
</head>
<body>

<div class="app">
  <header class="hud gut">
    <div><div class="money" id="money">500 ILS</div><div class="sub" id="lvlName">Level 1 · Village Stone Press</div></div>
    <div class="chips">
      <span class="chip" id="cQueue">Queue 0/8</span>
      <span class="chip" id="cSacks">Sacks 0</span>
      <span class="chip" id="cPaste">Paste 0</span>
      <span class="chip" id="cTins">Tins 0</span>
      <span class="chip" id="cLost">Lost 0</span>
      <button class="snd" id="snd" aria-label="Sound on">🔊</button>
      <button class="snd" id="bPause" aria-label="Pause">⏸</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <button class="lvpop" id="lvPop" hidden></button>
    <div class="hint" id="hint">Drag to move · pinch or scroll to zoom</div>
    <div class="paused" id="pausedOv" hidden><b>Paused</b><button class="btn" id="bResume">Resume</button></div>
    <div class="banner" id="banner" style="opacity:0"><b id="bnT"></b><span id="bnS"></span></div>
    <div class="sheet gut" id="sheet" hidden>
      <div class="sh-head"><h3 id="shTitle">Stone mill</h3><button class="x" id="shClose" aria-label="Close">✕</button></div>
      <div class="rows" id="shRows"></div>
      <div id="shMove" hidden style="display:flex;flex-direction:column;gap:6px">
        <p class="mvtxt" id="mvText"></p>
        <div class="bar"><i id="saveBar"></i></div>
        <p class="mvtxt" id="moveP"></p>
        <button class="btn" id="bMove"></button>
        <button class="lnk" id="bRestart">Restart this level</button>
        <button class="lnk" id="bReset">Start over</button>
      </div>
    </div>
  </div>

  <nav class="dock gut" id="dock">
    <button class="dk" data-k="intake"><span class="dn" id="intake-dn">Intake</span><span class="ds" id="intake-ds"></span><i class="dot" id="intake-dot" hidden></i></button>
    <button class="dk" data-k="mill"><span class="dn" id="mill-dn">Mill</span><span class="ds" id="mill-ds"></span><i class="dot" id="mill-dot" hidden></i></button>
    <button class="dk" data-k="press"><span class="dn" id="press-dn">Press</span><span class="ds" id="press-ds"></span><i class="dot" id="press-dot" hidden></i></button>
    <button class="dk" data-k="shop"><span class="dn" id="shop-dn">Shop</span><span class="ds" id="shop-ds"></span><i class="dot" id="shop-dot" hidden></i></button>
    <button class="dk mv" data-k="move"><span class="dn" id="mvLabel">Level 2</span><span class="mini"><i id="miniBar"></i></span></button>
  </nav>
</div>

<script src="three.min.js"></script>
<script>
(() => {
const $=id=>document.getElementById(id);
const stage=$('stage'), canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();
{ const c=document.createElement('canvas'); c.width=2; c.height=256; const x=c.getContext('2d'); const g=x.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#86b4d6'); g.addColorStop(0.6,'#cfe1e6'); g.addColorStop(1,'#efe6d2'); x.fillStyle=g; x.fillRect(0,0,2,256);
  const tx=new THREE.CanvasTexture(c); tx.encoding=THREE.sRGBEncoding; scene.background=tx; }
scene.fog=new THREE.Fog('#dfe6df',55,150);
const camera=new THREE.PerspectiveCamera(40,1,0.1,300);

// ---------- camera rig: fixed angle, the ground stays under your finger ----------
const YAW=0, PITCH=0.6;   // straight on, facing the press house
const cam={tx:0,tz:1.5,dist:19};
const BOUND={x0:-33,x1:34,z0:-10,z1:12}, DMIN=7, DMAX=36;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function applyCam(){
  cam.dist=clamp(cam.dist,DMIN,DMAX); cam.tx=clamp(cam.tx,BOUND.x0,BOUND.x1); cam.tz=clamp(cam.tz,BOUND.z0,BOUND.z1);
  const cp=Math.cos(PITCH);
  camera.position.set(cam.tx+Math.sin(YAW)*cp*cam.dist, Math.sin(PITCH)*cam.dist, cam.tz+Math.cos(YAW)*cp*cam.dist);
  camera.lookAt(cam.tx,0.6,cam.tz); camera.updateMatrixWorld();
}
let SR=stage.getBoundingClientRect();
function resize(){ SR=stage.getBoundingClientRect(); if(!SR.width||!SR.height) return; renderer.setSize(SR.width,SR.height,false); camera.aspect=SR.width/SR.height; camera.fov=camera.aspect<0.8?58:40; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize(); applyCam();

scene.add(new THREE.HemisphereLight('#fff4dc','#7a6247',0.8));
const sun=new THREE.DirectionalLight('#fff1d0',1.0); sun.position.set(14,22,10); sun.castShadow=true;
sun.shadow.mapSize.set(1536,1536); Object.assign(sun.shadow.camera,{left:-40,right:36,top:26,bottom:-26,near:1,far:70}); sun.shadow.bias=-0.0005; sun.shadow.normalBias=0.02;
scene.add(sun);

// ---------- builders ----------
const MF={}, MS={}, MM={};
const flat=c=>MF[c]||(MF[c]=new THREE.MeshStandardMaterial({color:c,roughness:.9,flatShading:true}));
const soft=c=>MS[c]||(MS[c]=new THREE.MeshStandardMaterial({color:c,roughness:.75}));
const metal=c=>MM[c]||(MM[c]=new THREE.MeshStandardMaterial({color:c,roughness:.35,metalness:.55}));
let PAR=scene;
function add(geo,material,x=0,y=0,z=0,parent=PAR){ const m=new THREE.Mesh(geo,material); m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; parent.add(m); return m; }
const box=(w,h,d,c,x,y,z,p)=>add(new THREE.BoxGeometry(w,h,d),flat(c),x,y,z,p);
const sbox=(w,h,d,c,x,y,z,p)=>add(new THREE.BoxGeometry(w,h,d),metal(c),x,y,z,p);
const cyl=(rt,rb,h,c,x,y,z,p,seg=12)=>add(new THREE.CylinderGeometry(rt,rb,h,seg),flat(c),x,y,z,p);
const scyl=(rt,rb,h,c,x,y,z,p,seg=20)=>add(new THREE.CylinderGeometry(rt,rb,h,seg),metal(c),x,y,z,p);
const blob=(r,c,x,y,z,p,d=1)=>add(new THREE.IcosahedronGeometry(r,d),flat(c),x,y,z,p);
const sph=(r,c,x,y,z,p)=>add(new THREE.SphereGeometry(r,18,14),soft(c),x,y,z,p);
const cap=(r,l,c,x,y,z,p)=>add(new THREE.CapsuleGeometry(r,l,6,14),soft(c),x,y,z,p);
const scap=(r,l,c,x,y,z,p)=>add(new THREE.CapsuleGeometry(r,l,8,20),metal(c),x,y,z,p);
const pick=a=>a[Math.floor(Math.random()*a.length)];
let seed=11; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const dm=new THREE.Object3D();
const STEEL='#cfd6da', BLUE='#2f6fa3';

// ---------- world (stays across levels) ----------
{ const g=new THREE.PlaneGeometry(220,220,90,90); g.rotateX(-Math.PI/2);
  const cols=[new THREE.Color('#c9a776'),new THREE.Color('#bc9a69'),new THREE.Color('#d0b386'),new THREE.Color('#b8a070')];
  const arr=[]; for (let i=0;i<g.attributes.position.count;i++){ const c=cols[Math.floor(rnd()*cols.length)]; arr.push(c.r,c.g,c.b); }
  g.setAttribute('color',new THREE.Float32BufferAttribute(arr,3));
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,flatShading:true})); m.receiveShadow=true; scene.add(m); }
for (const [w,h,x,z] of [[44,3,-16,5.6],[26,2.6,16,4.8]]){ const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),flat('#dccaa2')); p.rotation.x=-Math.PI/2; p.position.set(x,0.012,z); p.receiveShadow=true; scene.add(p); }
// distant hills
for (let i=0;i<18;i++){ const a=i/18*Math.PI*2+rnd()*0.2, r=85+rnd()*25; const h=blob(18+rnd()*14,i%2?'#a9b18c':'#b8ad84',Math.cos(a)*r,-4,Math.sin(a)*r,scene,1); h.scale.y=0.35+rnd()*0.2; h.castShadow=false; }
// stones + dry grass
{ const sm=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1,0),flat('#dacbad'),120);
  for(let i=0;i<120;i++){ const a=rnd()*Math.PI*2, r=9+rnd()*34; dm.position.set(Math.cos(a)*r,0.04,Math.sin(a)*r); dm.rotation.set(rnd(),rnd()*6,rnd()); const s=0.12+rnd()*0.25; dm.scale.set(s,s*0.5,s); dm.updateMatrix(); sm.setMatrixAt(i,dm.matrix); }
  sm.receiveShadow=true; scene.add(sm);
  const tm=new THREE.InstancedMesh(new THREE.ConeGeometry(0.12,0.45,4),new THREE.MeshStandardMaterial({color:'#fff',roughness:1,flatShading:true}),320);
  const TC=['#b9a15f','#a8a15a','#c4ab6a','#8f9a5a'].map(c=>new THREE.Color(c));
  for(let i=0;i<320;i++){ const a=rnd()*Math.PI*2, r=8+rnd()*36; dm.position.set(Math.cos(a)*r,0.2,Math.sin(a)*r); dm.rotation.set((rnd()-.5)*.5,rnd()*6,(rnd()-.5)*.5); dm.scale.setScalar(0.7+rnd()*0.9); dm.updateMatrix(); tm.setMatrixAt(i,dm.matrix); tm.setColorAt(i,TC[i%4]); }
  scene.add(tm); }
// dry-stone terraces in the grove
{ const st=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({color:'#fff',roughness:.95,flatShading:true}),520); let n=0;
  const SC=['#d8c9a8','#cbbb98','#e2d4b5','#bfae8c'].map(c=>new THREE.Color(c));
  for (const [cx,cz,r,a0,a1] of [[0,0,17,3.6,5.9],[0,0,22,0.2,2.6],[0,0,27,3.3,6.1],[0,0,25,0.4,1.2]]){
    for (let a=a0;a<a1&&n<520;a+=0.045){ for (let row=0;row<2&&n<520;row++){ dm.position.set(cx+Math.cos(a)*r,0.18+row*0.3,cz+Math.sin(a)*r); dm.rotation.set(0,-a+rnd()*0.2,0); dm.scale.set(0.35,0.28,0.75+rnd()*0.3); dm.updateMatrix(); st.setMatrixAt(n,dm.matrix); st.setColorAt(n,SC[n%4]); n++; } } }
  st.count=n; st.castShadow=true; st.receiveShadow=true; scene.add(st); }

// olive trees: gnarled split trunks, silver-green leaf clusters
const leafList=[], oliveList=[];
function tree(x,z,s=1){
  const g=new THREE.Group(); g.position.set(x,0,z); g.scale.setScalar(s); g.rotation.y=rnd()*6; scene.add(g);
  const base=blob(0.7,'#5e4d3c',0,0.18,0,g,1); base.scale.set(1,0.4,1);
  const n=rnd()<0.5?3:2, ends=[];
  for (let i=0;i<n;i++){
    const a=i/n*Math.PI*2+rnd()*0.8, lean=0.5+rnd()*0.35, tw=(rnd()-.5)*0.6;
    const pts=[[Math.cos(a)*0.15,0,Math.sin(a)*0.15],[Math.cos(a+tw)*0.3,0.8,Math.sin(a+tw)*0.3],[Math.cos(a)*lean*1.1,1.6,Math.sin(a)*lean*1.1],[Math.cos(a-tw)*lean*1.9,2.4+rnd()*0.3,Math.sin(a-tw)*lean*1.9]].map(p=>new THREE.Vector3(...p));
    const curve=new THREE.CatmullRomCurve3(pts);
    add(new THREE.TubeGeometry(curve,14,0.24-i*0.03,7,false),flat(i%2?'#6e5d4a':'#5e4d3c'),0,0,0,g);
    const p2=curve.getPoint(0.65), dir=new THREE.Vector3(Math.cos(a+1.2),0.8,Math.sin(a+1.2)).normalize();
    const c2=new THREE.CatmullRomCurve3([p2,p2.clone().addScaledVector(dir,0.6),p2.clone().addScaledVector(dir,1.2).add(new THREE.Vector3(0,0.2,0))]);
    add(new THREE.TubeGeometry(c2,6,0.09,5,false),flat('#6e5d4a'),0,0,0,g);
    ends.push(pts[3], c2.getPoint(1));
  }
  ends.push(new THREE.Vector3(0,3.0,0));
  g.updateMatrixWorld(true);
  const LEAF=['#8d9e7b','#7b8c69','#a3b293','#6f8060','#b3c0a3'];
  for (const e of ends){
    const cnt=5+Math.floor(rnd()*3);
    for (let k=0;k<cnt;k++){
      const p=e.clone().add(new THREE.Vector3((rnd()-.5)*1.5,(rnd()-.2)*0.7,(rnd()-.5)*1.5));
      leafList.push({p:p.applyMatrix4(g.matrixWorld),r:(0.38+rnd()*0.38)*s,c:new THREE.Color(LEAF[Math.floor(rnd()*LEAF.length)])});
      if (rnd()<0.5) oliveList.push(e.clone().add(new THREE.Vector3((rnd()-.5)*1.6,(rnd()-.6)*0.8,(rnd()-.5)*1.6)).applyMatrix4(g.matrixWorld));
    }
  }
}
[[-12,-9],[-31,-9],[-14,-15],[-8,-16],[-25,10],[21,-9],[25,11],[12,-16],[-4,-12],[4,-13],[37,-1],[-24,-8],[0,-17],[-35,3],[29,-9],[-19,-11],[20,-14]].forEach(([x,z])=>tree(x,z,0.9+rnd()*0.3));

function pose(p,dt,moving){
  if (moving){ p.walk+=dt*9; p.legs[0].rotation.x=Math.sin(p.walk)*0.55; p.legs[1].rotation.x=-Math.sin(p.walk)*0.55; }
  else p.legs.forEach(l=>l.rotation.x*=0.8);
  if (p.load && p.load.visible) p.arms.forEach(a=>a.rotation.x= p.carry==='sack'?2.5:-1.2);
  else if (p.tin.visible){ p.arms[0].rotation.x=moving?-Math.sin(p.walk)*0.4:0; p.arms[1].rotation.x=0; }
  else if (moving){ p.arms[0].rotation.x=-Math.sin(p.walk)*0.45; p.arms[1].rotation.x=Math.sin(p.walk)*0.45; }
  else p.arms.forEach(a=>a.rotation.x*=0.85);
}
function moveTo(p,tx,tz,speed,dt){
  const dx=tx-p.g.position.x, dz=tz-p.g.position.z, d=Math.hypot(dx,dz);
  if (d<0.05){ pose(p,dt,false); return true; }
  const s=Math.min(d,speed*dt); p.g.position.x+=dx/d*s; p.g.position.z+=dz/d*s;
  let a=Math.atan2(dx,dz)-p.g.rotation.y; a=Math.atan2(Math.sin(a),Math.cos(a)); p.g.rotation.y+=a*Math.min(1,dt*8);
  pose(p,dt,true); return false;
}
function face(p,angle,dt){ let a=angle-p.g.rotation.y; a=Math.atan2(Math.sin(a),Math.cos(a)); p.g.rotation.y+=a*Math.min(1,dt*6); }


// ---------- sound: synthesized with Web Audio, unlocks on the first touch ----------
const SND={ac:null,out:null,hum:null,brown:null,white:null,on:true,last:{}};
try{ SND.on=localStorage.getItem('olive-press-sound')!=='off'; }catch(_){}
function audioUnlock(){
  if (!SND.ac){ const AC=window.AudioContext||window.webkitAudioContext; if (!AC) return;
    try{ const ac=SND.ac=new AC(); SND.out=ac.createGain(); SND.out.gain.value=SND.on?0.8:0; SND.out.connect(ac.destination);
      const n=ac.sampleRate*2; SND.brown=ac.createBuffer(1,n,ac.sampleRate); SND.white=ac.createBuffer(1,n,ac.sampleRate);
      const b=SND.brown.getChannelData(0), w=SND.white.getChannelData(0); let l=0;
      for (let i=0;i<n;i++){ const r=Math.random()*2-1; w[i]=r; l=(l+0.02*r)/1.02; b[i]=l*3.5; }
      // machine rumble: looped brown noise, louder the more machines run
      const src=ac.createBufferSource(); src.buffer=SND.brown; src.loop=true;
      const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=320;
      SND.hum=ac.createGain(); SND.hum.gain.value=0; src.connect(lp).connect(SND.hum).connect(SND.out); src.start();
    }catch(_){ SND.ac=null; return; } }
  if (SND.ac.state==='suspended') SND.ac.resume();
}
window.addEventListener('pointerdown',audioUnlock,true); window.addEventListener('keydown',audioUnlock,true);
function tone(f,dur,{type='sine',vol=0.18,to=null,at=0}={}){
  const ac=SND.ac; if (!ac) return; const t0=ac.currentTime+at;
  const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.setValueAtTime(f,t0); if (to) o.frequency.exponentialRampToValueAtTime(to,t0+dur);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g).connect(SND.out); o.start(t0); o.stop(t0+dur+0.05);
}
function noise(dur,{vol=0.3,freq=800,q=1,at=0,type='lowpass',white=false}={}){
  const ac=SND.ac; if (!ac) return; const t0=ac.currentTime+at;
  const s=ac.createBufferSource(); s.buffer=white?SND.white:SND.brown; const f=ac.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
  const g=ac.createGain(); g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f).connect(g).connect(SND.out); s.start(t0,Math.random()); s.stop(t0+dur+0.05);
}

const idle=k=>{ let best=-1; runs[k].forEach((r,i)=>{ if (!r && !G.st[k].w[i] && (best<0 || G.st[k].u[i]>G.st[k].u[best])) best=i; }); return best; };

// ---------- touch / mouse ----------
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
function toNdc(x,y){ ndc.set(((x-SR.left)/SR.width)*2-1, -((y-SR.top)/SR.height)*2+1); }
function groundAt(x,y){ toNdc(x,y); ray.setFromCamera(ndc,camera); const out=new THREE.Vector3(); return ray.ray.intersectPlane(plane,out)?out:null; }
const hits=[];
function hitBox(k,w,h,d,x,y,z,extra=false){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshBasicMaterial({visible:false})); m.position.set(x,y,z); m.userData={k,extra}; scene.add(m); hits.push(m); }
hitBox('intake',2.6,3,2.4,-5.6,1.3,5.4); hitBox('mill',6,3,4.6,-3.2,1.3,0.2); hitBox('press',3.6,4.2,3.4,2.9,2,-1.2); hitBox('shop',3.8,3,2.8,5.0,1.3,4.1);
function tapAt(x,y){
  if (paused) return;
  toNdc(x,y); ray.setFromCamera(ndc,camera); const h=ray.intersectObjects(hits,false)[0]; if (!h) return;
  const k=h.object.userData.k, p=h.point;

}
const ptrs=new Map(); let grab=null, pinch=null, tap=null, vel={x:0,z:0}, lastMove=0, hinted=false;
function hideHint(){ if(!hinted){ hinted=true; $('hint').style.opacity=0; } }
canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); vel={x:0,z:0};
  if (ptrs.size===1){ grab=groundAt(e.clientX,e.clientY); tap={x:e.clientX,y:e.clientY,t:performance.now(),moved:0,btn:e.button}; }
  if (ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d0:Math.hypot(a.x-b.x,a.y-b.y),dist0:cam.dist,anchor:groundAt((a.x+b.x)/2,(a.y+b.y)/2)}; grab=null; tap=null; }
});
canvas.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId); if (!p) return;
  const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
  if (tap) tap.moved+=Math.hypot(dx,dy);
  if (ptrs.size===1 && grab){
    const cur=groundAt(e.clientX,e.clientY); if (!cur) return;
    const mx=grab.x-cur.x, mz=grab.z-cur.z; cam.tx+=mx; cam.tz+=mz; applyCam();
    const now=performance.now(), dt=Math.max(8,now-lastMove)/1000; lastMove=now;
    vel={x:vel.x*0.5+mx/dt*0.5, z:vel.z*0.5+mz/dt*0.5};
    if (tap && tap.moved>10) hideHint();
  } else if (ptrs.size===2 && pinch){
    const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y);
    cam.dist=pinch.dist0*pinch.d0/Math.max(20,d); applyCam();
    if (pinch.anchor){ const cur=groundAt((a.x+b.x)/2,(a.y+b.y)/2); if (cur){ cam.tx+=pinch.anchor.x-cur.x; cam.tz+=pinch.anchor.z-cur.z; applyCam(); } }
    hideHint();
  }
});
function endPtr(e){
  if (!ptrs.has(e.pointerId)) return;
  if (tap && ptrs.size===1 && tap.moved<10 && performance.now()-tap.t<500 && tap.btn===0) tapAt(e.clientX,e.clientY);
  if (performance.now()-lastMove>80) vel={x:0,z:0};
  ptrs.delete(e.pointerId); tap=null;
  if (ptrs.size===1){ const [p]=[...ptrs.values()]; grab=groundAt(p.x,p.y); pinch=null; vel={x:0,z:0}; }
  if (ptrs.size===0){ grab=null; pinch=null; }
}
canvas.addEventListener('pointerup',endPtr); canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{ e.preventDefault(); const a=groundAt(e.clientX,e.clientY); cam.dist*=Math.exp(e.deltaY*0.0012); applyCam();
  if (a){ const c=groundAt(e.clientX,e.clientY); if (c){ cam.tx+=a.x-c.x; cam.tz+=a.z-c.z; applyCam(); } } hideHint(); },{passive:false});

// ---------- level setup ----------
function clearPeople(){ for (const arr of [queue,leaving,customers]){ arr.forEach(p=>scene.remove(p.g)); arr.length=0; } }
// where a worker stands: main machines use BASE, extension machines stand beside (back slot) or in front (front slot)
function wSpot(k,i){
  if (!MACH(k) || !i) return {p:BASE[k].wPos, f:BASE[k].wFace};
  const [x,,z]=mpos[k][i];
  return {p:[x+0.4,0.3,z+(G.lvl===0&&k==='mill'?3.4:2.1)], f:Math.PI};   // in front of the machine, clear of the donkey's path
}
function spawnWorker(k,i=0){
  const key=MACH(k)?k+i:k; if (workers[key]) scene.remove(workers[key].g);
  const modern=!L().wood, sp=wSpot(k,i);
  const w=makePerson({hat:modern?'cap':pick(['cap','kef']),capColor:'#2c5aa0',shirt:modern?'#f2f4f5':'#3e5a7a',pants:modern?'#3e5a7a':undefined,moustache:Math.random()<0.7});
  w.g.position.set(...sp.p); w.g.rotation.y=sp.f; w.k=k; w.i=i; w.face=sp.f; workers[key]=w; cool[key]=0;
}
// extension bays + extra machines; rebuilt whenever one is bought
function buildExtras(){
  if (EXG) LG.remove(EXG);
  EXG=new THREE.Group(); LG.add(EXG);
  for (let i=hits.length-1;i>=0;i--) if (hits[i].userData.extra){ scene.remove(hits[i]); hits.splice(i,1); }
  for (let b=0;b<G.bays;b++) buildBay(EXG,b, b+2>=G.bays);
  if (signG) signG.position.x=-(L().hw+(G.bays>>1)*L().bw)-2.7;
  for (const k of ['mill','press']){ mh[k]=[mainHooks[k]]; mpos[k]=[MAINPOS[k]]; }
  G.slots.forEach((k,s)=>{ if (!k) return; const [x,z]=slotPos(s); mh[k].push(L().mk[k](EXG,x,z)); mpos[k].push([x,k==='press'?4.6:3.9,z]); hitBox(k,L().bw/2-0.3,3.4,4.4,x,1.5,z,true); });
  for (const k of ['mill','press']){
    while (runs[k].length<mh[k].length) runs[k].push(null);
    runs[k].length=mh[k].length;
    while (tags[k].length>mh[k].length) tags[k].pop().remove();
    while (tags[k].length<mh[k].length) tags[k].push(ov('tag',tagHtml));
    tags[k].forEach((el,i)=>el.firstChild.textContent=mh[k].length>1?`${L().names[k][1]} ${i+1}`:L().names[k][0]);
  }
  for (const key in workers) if (workers[key] && MACH(workers[key].k)){ scene.remove(workers[key].g); delete workers[key]; }
  for (const k of ['mill','press']) G.st[k].w.forEach((w,i)=>{ if (w) spawnWorker(k,i); });
}
function setupLevel(){

  mainHooks=L().build(); buildCommon(L());
  PAR=scene;

  for (const k of ['intake','shop']) if (G.st[k].w) spawnWorker(k);

function moveUp(){

// ---------- simulation ----------
// seconds between farmers your setup can handle: the slowest of intake, mills, presses and shop
function capGap(maxed){
  const lv=L(), mw=MAX;
  const tp=(k,T)=>{ const n=maxed?lv.maxU:N(k); let a=0;
    for (let i=0;i<n;i++){ const l=maxed?MAX:G.st[k].u[i], w=maxed?mw:G.st[k].w[i]; a+=1/(T[l-1]*(w?1-0.06*(w-1):1)+(w?W_DELAY[w-1]:0)); } return a; };   // the worker reloads after each batch
  const q=k=>{ const w=maxed?mw:G.st[k].w; return w?Math.max(Q_DELAY[w-1],0.55):0.8; };   // 0.55 s for the next person to step up
  return Math.max(1/tp('mill',MILL_T), 1/tp('press',PRESS_T), q('intake'), q('shop'));
}
// demand starts at twice a fresh level's single mill and press, then climbs over 10-30 min
// to just under a fully maxed level: every upgrade cuts your losses; a maxed level keeps a long line but loses no one
function arriveGap(){
  const top=capGap(true)/0.97, start=Math.max(MILL_T[0],PRESS_T[0])/2, ramp=600+300*G.lvl;
  return Math.max(top, start*Math.pow(top/start, Math.min(1,G.lt/ramp)));
}
function spawnFarmer(){
  const woman=Math.random()<0.35;
  const f=makePerson({woman,hat:pick(['kef','kef','cap','straw']),moustache:!woman&&Math.random()<.6,carry:L().carry});
  const sx=Math.min(-18,-(L().hw+(G.bays>>1)*L().bw)-8);
  if (queue.length>=QMAX){ f.g.position.set(sx,0,6.6); f.angry=true; f.phase=0; leaving.push(f); return; }
  f.g.position.set(sx,0,5.4); queue.push(f);
}
function update(dt){
  t+=dt; G.lt+=dt;
  arriveT-=dt; if (arriveT<=0){ const n=1+Math.floor(Math.random()*3); arriveT=arriveGap()*n*(0.8+Math.random()*0.4); groupN+=n; }
  if (groupN>0){ groupT-=dt; if (groupT<=0){ groupN--; groupT=0.7; spawnFarmer(); } }
  birdT-=dt; if (birdT<=0){ birdT=7+Math.random()*10; sfx('bird'); }
  queue.forEach((f,i)=>{ const [x,z]=qSlot(i); f.atSlot=moveTo(f,x,z,f.g.position.x<x-2?4.5:2.4,dt); if (f.atSlot) face(f,Math.PI/2,dt); });
  if (intakeBusy>0) intakeBusy=Math.max(0,intakeBusy-dt);
  for (let i=leaving.length-1;i>=0;i--){
    const f=leaving[i];
    if (f.angry){
      if (f.phase===0){ const ex=qSlot(QMAX)[0]-1; if (moveTo(f,ex,6.6,2.4,dt)){ f.phase=1; G.lost++; floatAt(ex,2.8,6.6,'Queue too long!','bad'); sfx('bad'); } }
      else if (moveTo(f,-38,7.4,2.4,dt)){ scene.remove(f.g); leaving.splice(i,1); }
    } else if (f.phase===0){ if (moveTo(f,-6.6,7.2,2.4,dt)) f.phase=1; }
    else if (moveTo(f,-38,7.2,2.6,dt)){ scene.remove(f.g); leaving.splice(i,1); }
  }
  runs.mill.forEach((r,i)=>{ if (r){ r.t+=dt; if (r.t>=r.dur){ runs.mill[i]=null; pasteReady++; const p=mpos.mill[i]; floatAt(i?p[0]:0.9,1.8,i?p[2]:0.8,'Paste ready','w'); sfx('paste'); } } });
  runs.press.forEach((r,i)=>{ if (r){ r.t+=dt; if (r.t>=r.dur){ runs.press[i]=null; tinStock=Math.min(STOCK,tinStock+1); floatAt(5,2.6,0.6,`+${units(1)} ${unitWord(units(1))}`,'w'); sfx('drip'); } } });
  custT-=dt; if (custT<=0){
    custT=arriveGap()*(tinStock>=6?0.7:tinStock>=2?1:1.3)*(0.8+Math.random()*0.4);
    if (customers.filter(c=>c.phase<2).length<6){ const woman=Math.random()<0.5; const c=makePerson({woman,hat:pick(['straw','kef','cap']),moustache:!woman&&Math.random()<.5,unit:L().unit}); c.g.position.set(16,0,15); c.phase=0; c.wait=0; customers.push(c); } }
  customers.filter(c=>c.phase<2).forEach((c,i)=>{ const [x,z]=cSlot(i); if (moveTo(c,x,z,2.6,dt)){ face(c,Math.PI,dt); if (i===0) c.phase=1; } c.wait+=dt;
    if (c.wait>25){ c.phase=2; G.lost++; sfx('bad'); floatAt(c.g.position.x,2.8,c.g.position.z,'Left without oil','bad'); } });
  for (let i=customers.length-1;i>=0;i--){ const c=customers[i]; if (c.phase===2 && moveTo(c,30,5.0,2.6,dt)){ scene.remove(c.g); customers.splice(i,1); } }
  for (const key in workers){ const w=workers[key]; if (!w) continue; const k=w.k, i=w.i;
    face(w,w.face,dt); w.arms[1].rotation.x*=0.92;
    if (cool[key]>0){ cool[key]-=dt; continue; }
    if (MACH(k)){ if (runs[k][i]) w.busy=true;
      else if (w.busy){ w.busy=false; cool[key]=delayOf(k,G.st[k].w[i]); }   // a slower worker takes longer to reload after each batch
      else if (hasInput(k)){ startMachine(k,i); w.busy=true; w.arms[1].rotation.x=-1.2; } }
    else if (canDo(k)){ doAction(k); cool[key]=delayOf(k,G.st[k].w); w.arms[1].rotation.x=-1.2; }
  }
  for (const k of ['mill','press']) mh[k].forEach((h,i)=>{ const r=runs[k][i]; h(r, r?r.t/r.dur:0, dt, t); });
  pileMeshes.forEach((s,k)=>s.visible=k<sacks);
  matMeshes.forEach((m,k)=>m.visible=k<pasteReady);
  productMeshes.forEach((s,k)=>s.visible=k<tinStock);
}

// ---------- save / offline ----------
const KEY='olive-press-tycoon-v1';
function save(){ try{ localStorage.setItem(KEY,JSON.stringify({...G,live:{q:queue.length,sacks,paste:pasteReady,tins:tinStock},savedAt:Date.now()})); }catch(_){} }
function load(){
  try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if (!s||!s.st) return null; return s; }catch(_){ return null; }
}
function offlineRate(){
  if (!G.st.intake.w || !G.st.shop.w || !G.st.mill.w.some(Boolean) || !G.st.press.w.some(Boolean)) return 0;
  const tp=(k,T)=>G.st[k].u.reduce((a,l,i)=>a+(G.st[k].w[i]?1/(T[l-1]*wSpeed(k,i)+delayOf(k,G.st[k].w[i])):0),0);
  const per=Math.max(1/tp('mill',MILL_T), 1/tp('press',PRESS_T), FLOOR[G.lvl]);
  return price()*L().batch/per*0.5;
}
setInterval(save,5000);
document.addEventListener('visibilitychange',()=>{ if (document.hidden) save(); });

// ---------- dock + sheet ----------
const sheet=$('sheet'), rowsEl=$('shRows'); let sel=null, rowSig='', curRows=[];
function openSheet(k){ sel=k; sheet.hidden=false; rowSig=''; document.querySelectorAll('.dk').forEach(b=>b.classList.toggle('sel',b.dataset.k===k)); resetArmed(); ui(); }
function closeSheet(){ sel=null; sheet.hidden=true; document.querySelectorAll('.dk').forEach(b=>b.classList.remove('sel')); }
document.querySelectorAll('.dk').forEach(b=>b.onclick=()=> sel===b.dataset.k ? closeSheet() : openSheet(b.dataset.k));
$('shClose').onclick=closeSheet;
const cm=()=>L().cm;
const fmt=n=>Math.floor(n).toLocaleString();
const pips=(n,max=MAX)=>Array.from({length:max},(_,i)=>`<span class="${i<n?'on':''}"></span>`).join('');
// one card per machine (or station): label, value, pips, worker line and its buy buttons
function rowSpecs(k){
  const s=G.st[k], c=cm(), nm=L().names[k], out=[];
  const card=(name,l,w,setL,setW,spot)=>{
    const btns=[], mc=BASE[k].mCost[l-1]*c;
    btns.push(l>=MAX?{txt:'Machine maxed',cls:'btn',off:true,cost:0}:{txt:`Upgrade · ${fmt(mc)} ILS`,cls:'btn',cost:mc,
      act(){ setL(l+1); const p=spot(); floatAt(p[0],2.9,p[2],'Upgraded!','w'); sfx('up'); }});
    if (!w){ const hc=BASE[k].hire*c; btns.push({txt:`Hire worker · ${fmt(hc)} ILS`,cls:'btn hire',cost:hc,act(){ setW(1); const p=spot(); floatAt(p[0],2.9,p[2],'Hired!','w'); sfx('up'); }}); }
    else if (w>=MAX) btns.push({txt:'Worker maxed',cls:'btn',off:true,cost:0});
    else { const tc=W_COST[w-1]*c; btns.push({txt:`Train worker · ${fmt(tc)} ILS`,cls:'btn',cost:tc,act(){ setW(w+1); const p=spot(); floatAt(p[0],2.9,p[2],'Faster worker!','w'); sfx('up'); }}); }
    const nextM=l<MAX?` → ${mDesc(k,l+1)}`:'';
    out.push({name, val:mDesc(k,l)+nextM, pips:pips(l), wk: w?`Worker: reacts in ${delayOf(k,w)} s${w<MAX?' → '+delayOf(k,w+1)+' s':''}`:'No worker: you tap it yourself', btns});
  };
  if (!MACH(k)) card(nm[1],s.m,s.w,v=>s.m=v,v=>{ s.w=v; if (v===1) spawnWorker(k); },()=>BASE[k].wPos);
  else {
    const n=N(k), max=L().maxU, room=roomFree(), r={name:'Machines', val:`${n} of ${max} · ${room>0?room+' free space'+(room>1?'s':''):'no free space'}`, pips:pips(n,max), wk:'Each new machine starts at Lv 1 and needs its own worker.'};
    if (n>=max) r.btns=[{txt:'All machines for this level',cls:'btn',off:true,cost:0}];
    else if (room<=0){ const cost=bayCost(); r.btns=[{txt:`Build extension (2 spaces) · ${fmt(cost)} ILS`,cls:'btn exp',cost,
      act(){ G.bays++; buildExtras(); const [x]=slotPos((G.bays-1)*2); floatAt(x,3.5,0,'Extension built!','w'); sfx('build'); }}]; }
    else { const cost=addCost(k); r.btns=[{txt:`Add ${nm[1].toLowerCase()} · ${fmt(cost)} ILS`,cls:'btn hire',cost,
      act(){ const sl=freeSlot(k), at=1+G.slots.slice(0,sl).filter(x=>x===k).length; s.u.splice(at,0,1); s.w.splice(at,0,0); G.slots[sl]=k; buildExtras(); const [x,z]=slotPos(sl); floatAt(x,3.6,z,'New machine!','w'); sfx('build'); }}]; }
    out.push(r);
    s.u.forEach((l,i)=>card(`${nm[1]} ${i+1}`,l,s.w[i],v=>s.u[i]=v,v=>{ s.w[i]=v; if (v===1) spawnWorker(k,i); },()=>{ const p=mpos[k][i]; return [p[0],0,p[2]]; }));
  }
  return out;
}
rowsEl.addEventListener('click',e=>{ const b=e.target.closest('button[data-i]'); if (!b) return; const r=curRows[+b.dataset.i], bt=r&&r.btns[+b.dataset.j];
  if (!bt||bt.off||!bt.act||G.money<bt.cost) return; G.money-=bt.cost; bt.act(); save(); ui(); });
$('bMove').onclick=moveUp;
let paused=false;
function setPause(v){ paused=v; $('pausedOv').hidden=!v; $('bPause').textContent=v?'▶':'⏸'; $('bPause').setAttribute('aria-label',v?'Resume':'Pause'); if (v) save(); }
$('bPause').onclick=()=>setPause(!paused); $('bResume').onclick=()=>setPause(false);
$('lvPop').onclick=()=>{ $('lvPop').hidden=true; openSheet('move'); };
let armed=false;
let armedL=false;
function resetArmed(){ armed=false; $('bReset').textContent='Start over'; $('bReset').classList.remove('armed');
  armedL=false; $('bRestart').textContent='Restart this level'; $('bRestart').classList.remove('armed'); }
// back to how the level looked when you arrived: one machine of each, no workers, the money you came with
$('bRestart').onclick=()=>{ if (!armedL){ armedL=true; $('bRestart').textContent=`Tap again: restart Level ${G.lvl+1} with ${fmt(G.lvlMoney??G.money)} ILS`; $('bRestart').classList.add('armed'); return; }
  G.money=G.lvlMoney??G.money; G.lvlMoney=G.money; G.lt=0; G.lost=0; G.st=freshSt(); G.bays=0; G.slots=[]; G.lvNote=-1;
  setupLevel(); resetArmed(); save(); banner(`Level ${G.lvl+1}`,'Fresh start',3); };
$('bReset').onclick=()=>{ if (!armed){ armed=true; $('bReset').textContent='Tap again to erase all progress'; $('bReset').classList.add('armed'); return; }
  G=fresh(); try{ localStorage.removeItem(KEY); }catch(_){} setupLevel(); resetArmed(); banner('Level 1',L().name); };
function affordable(k){ if (k==='move') return false; return rowSpecs(k).some(r=>r.btns.some(b=>!b.off&&b.act&&G.money>=b.cost)); }
function ui(){
  $('money').textContent=fmt(G.money)+' ILS';
  const q=$('cQueue'); q.textContent=`Queue ${queue.length}/${QMAX}`; q.className='chip'+(queue.length>=QMAX?' bad':queue.length>=5?' warn':'');
  $('cSacks').textContent=`${L().carry==='sack'?'Sacks':'Crates'} ${units(sacks)}/${units(pileCap())}`;
  const pp=$('cPaste'); pp.textContent=`Paste ${pasteReady}/${pasteCap()}`; pp.className='chip'+(pasteReady>=pasteCap()?' bad':'');
  $('cTins').textContent=`${L().unit==='tin'?'Tins':'Cases'} ${units(tinStock)}`;
  const l=$('cLost'); if (G.lost!==lostSeen){ lostSeen=G.lost; lostAt=t; } l.textContent=`Lost ${G.lost}`; l.className='chip'+(G.lost&&t-lostAt<30?' bad':'');
  for (const k in BASE){ const s=G.st[k]; $(k+'-ds').textContent=MACH(k)?`${N(k)} mach · ${s.w.filter(Boolean).length} wkr`:`Lv ${s.m} · ${s.w?'worker '+s.w:'no worker'}`; $(k+'-dot').hidden=!affordable(k); }
  if (G.money>=L().move && G.lvNote!==G.lvl && !(L().final&&G.won)){ G.lvNote=G.lvl; const e=$('lvPop'); e.textContent=L().final?'Final goal ready! Tap to finish':`Level ${G.lvl+2} unlocked! Tap to move up`; e.hidden=false; clearTimeout(e.t); e.t=setTimeout(()=>e.hidden=true,9000); sfx('up'); }
  $('miniBar').style.width=Math.min(100,G.money/L().move*100)+'%';
  if (SND.hum){ const n=runs.mill.filter(Boolean).length+runs.press.filter(Boolean).length; SND.hum.gain.setTargetAtTime(n?0.1+0.04*Math.min(6,n):0,SND.ac.currentTime,0.3); }
  if (!sel) return;
  const isMove=sel==='move'; rowsEl.hidden=isMove; $('shMove').hidden=!isMove;
  if (isMove){
    $('shTitle').textContent = L().final ? 'Final goal' : `Level ${G.lvl+2} · ${LEVELS[G.lvl+1].name}`;
    $('mvText').textContent=L().next; $('saveBar').style.width=Math.min(100,G.money/L().move*100)+'%';
    $('moveP').textContent=`Saved ${fmt(Math.min(G.money,L().move))} / ${fmt(L().move)} ILS`;
    const b=$('bMove'); b.disabled=G.money<L().move || (L().final&&G.won);
    b.textContent = L().final ? (G.won?'Goal reached':'Claim the title') : `Move up · ${fmt(L().move)} ILS`;
    return; }
  $('shTitle').textContent=L().names[sel][0];
  curRows=rowSpecs(sel);
  const sig=sel+':'+curRows.map(r=>r.name+r.btns.length).join('|');
  if (sig!==rowSig){ rowSig=sig;
    rowsEl.innerHTML=curRows.map((r,i)=>`<div class="row"><span class="lab"><span></span><b></b></span><span class="pips"></span><span class="wk"></span><div class="bts${r.btns.length<2?' one':''}">${r.btns.map((_,j)=>`<button class="btn" data-i="${i}" data-j="${j}"></button>`).join('')}</div></div>`).join(''); }
  [...rowsEl.children].forEach((el,i)=>{ const r=curRows[i], lab=el.firstChild;
    lab.firstChild.textContent=r.name; lab.lastChild.textContent=r.val;
    const pp=el.children[1]; if (pp.innerHTML!==r.pips) pp.innerHTML=r.pips;
    el.children[2].textContent=r.wk||'';
    [...el.children[3].children].forEach((b,j)=>{ const bt=r.btns[j]; b.className=bt.cls; b.textContent=bt.txt; b.disabled=!!bt.off||G.money<bt.cost; }); });
}

// ---------- boot ----------
const saved=load();
if (saved){ G={...fresh(),...saved}; delete G.savedAt; delete G.live;
  for (const k of ['mill','press']){ if (!G.st[k].u) G.st[k]={u:[G.st[k].m||1],w:G.st[k].w||0};
    if (!Array.isArray(G.st[k].w)) G.st[k].w=G.st[k].u.map((_,i)=>i?0:(G.st[k].w||0)); }
  if (!Array.isArray(G.slots)) G.slots=[]; G.bays=G.bays||0;
  // older saves put presses in slot 0; mills now go on the left (same-type order is unchanged, so levels stay matched)
  for (let b=0;b<G.bays;b++) if (G.slots[2*b]==='press' && G.slots[2*b+1]==='mill'){ G.slots[2*b]='mill'; G.slots[2*b+1]='press'; } }
setupLevel();
if (saved && saved.live){ const v=saved.live; sacks=Math.min(v.sacks||0,pileCap()); pasteReady=Math.min(v.paste||0,pasteCap()); tinStock=Math.min(v.tins||0,STOCK);
  for (let i=0;i<Math.min(v.q||0,QMAX);i++){ spawnFarmer(); const f=queue[queue.length-1]; if (f){ const [x,z]=qSlot(i); f.g.position.set(x,0,z); } }
  if (v.q) groupN=0; }
if (saved && saved.savedAt){
  const away=Math.min(3*3600,(Date.now()-saved.savedAt)/1000), earned=offlineRate()*away;
  if (earned>1){ G.money+=earned; banner('Welcome back',`Your workers earned ${fmt(earned)} ILS while you were away.`,5); }
  else banner(`Level ${G.lvl+1}`,L().name);
} else banner('Abu Yousef Press','Tap the farmer to take his sack. Hire workers when you can.',5);

let last=performance.now(), uiT=0;
function frame(now){
  requestAnimationFrame(frame);
  if (now-last<31) return;   // ~30 fps is plenty here and saves battery
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  if (!paused) update(dt);
  if (ptrs.size===0 && (Math.abs(vel.x)+Math.abs(vel.z))>0.05){ cam.tx+=vel.x*dt; cam.tz+=vel.z*dt; const k=Math.pow(0.02,dt); vel.x*=k; vel.z*=k; applyCam(); }
  for (const k of ['mill','press']) tags[k].forEach((el,i)=>{ const r=runs[k][i]; place(el,...mpos[k][i]); el.lastChild.firstChild.style.width=(r?r.t/r.dur*100:0)+'%'; });
  for (const k in taps){ const show=(MACH(k)||!G.st[k].w) && canDo(k); taps[k].style.display=show?'':'none'; if (show) place(taps[k],...tapPos[k]()); }
  for (let i=floats.length-1;i>=0;i--){ const f=floats[i]; f.life-=dt; f.p.y+=dt*0.9; place(f.el,f.p.x,f.p.y,f.p.z); f.el.style.opacity=Math.min(1,f.life); if (f.life<=0){ f.el.remove(); floats.splice(i,1); } }
  if (bannerT>0){ bannerT-=dt; if (bannerT<=0) $('banner').style.opacity=0; }
  uiT-=dt; if (uiT<=0){ ui(); uiT=0.25; }
  renderer.render(scene,camera);
}
setTimeout(hideHint,8000);
requestAnimationFrame(frame);
})();
</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
